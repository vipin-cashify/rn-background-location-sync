buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['BackgroundLocation_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.1.20-1.0.32"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlin-parcelize"
apply plugin: "com.google.devtools.ksp"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["BackgroundLocation_" + name]).toInteger()
}

android {
  namespace "com.backgroundlocation"

  compileSdk = getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk = getExtOrIntegerDefault("minSdkVersion")
    targetSdk = getExtOrIntegerDefault("targetSdkVersion")

    // Export Room schemas for migration testing and validation
    ksp {
      arg("room.schemaLocation", "$projectDir/schemas")
      arg("room.incremental", "true")
    }
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  testOptions {
    unitTests.returnDefaultValues = true
    // Required so MigrationTestHelper (Robolectric-based unit tests, see
    // LocationDatabaseMigrationTest) can read the exported Room schema JSON
    // (wired into the `test` sourceSet's assets above) from the unit test
    // classpath - without this, `assets.srcDirs` is only honored for
    // instrumented (androidTest) builds, not plain JVM unit tests.
    unitTests.includeAndroidResources = true
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
    test {
      // Room's exported schema JSON (KSP `room.schemaLocation`, see defaultConfig above)
      // is read at test time by androidx.room:room-testing's MigrationTestHelper.
      assets.srcDirs += ["$projectDir/schemas".toString()]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // Google Play Services for Location
  implementation "com.google.android.gms:play-services-location:21.3.0"

  // WorkManager for safe recovery on Android 12+
  implementation "androidx.work:work-runtime-ktx:2.9.0"

  // Room
  def room = "2.6.1"
  implementation("androidx.room:room-runtime:$room")
  implementation("androidx.room:room-ktx:$room")
  ksp("androidx.room:room-compiler:$room")

  // Bulk-upload sync layer (Phase 3b): HTTP + JSON + encrypted token storage
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "com.squareup.moshi:moshi:1.15.1"
  implementation "com.squareup.moshi:moshi-kotlin:1.15.1"

  // Test
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
  testImplementation "app.cash.turbine:turbine:1.2.0"
  testImplementation "io.mockk:mockk:1.13.13"

  // Robolectric + Room migration testing (added for schema v2 sync bookkeeping tests -
  // real in-memory Room DB and real MigrationTestHelper coverage, not just mocked DAOs)
  testImplementation "org.robolectric:robolectric:4.16.1"
  testImplementation "androidx.test:core:1.6.1"
  testImplementation "androidx.room:room-testing:$room"

  // MockWebServer for LocationSyncManager HTTP tests (Phase 3b)
  testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"

  // WorkManager test harness for SyncWorker (real CoroutineWorker construction + a real,
  // programmatically-initialized WorkManager instance, no manifest/ContentProvider needed)
  testImplementation "androidx.work:work-testing:2.9.0"
}
